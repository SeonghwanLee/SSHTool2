[package]
name = "sshtool2"
version = "0.85.2"
description = "SSHTool2"
authors = ["Seonghwan Lee"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
russh = "0.62"
# 한글(비-UTF-8) 파일명 지원을 위해 문자열 처리 2곳을 바이트 보존으로 고친 사본.
# 패치 내용은 vendor/russh-sftp/PATCH.md 참고 — 업그레이드 시 재적용 필요.
russh-sftp = { path = "vendor/russh-sftp" }
uuid = { version = "1", features = ["v4"] }
aes-gcm = "0.10"
pbkdf2 = "0.12"
sha2 = "0.10"
base64 = "0.22"
encoding_rs = "0.8"
portable-pty = "0.9"
keyring = { version = "3", features = ["windows-native", "linux-native"] }
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
zip = "2"
ureq = "2"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[profile.release]
panic = "abort"
# 크기·성능 우선(원복). LTO 를 thin → 끔 순으로 완화해 봤지만 CI 빌드 시간이
# 471~522초에서 움직이지 않았다(fat 471·522 / thin 471 / 없음 489). 프로파일이
# 병목이 아니라는 뜻이라 되돌린다. LTO 를 끈 대가로 인스톨러만 7.8 → 8.00MB 커졌다.
#
# 남은 단서: Post Rust cache 가 매 실행마다 캐시를 저장한다(키가 맞으면 건너뛴다).
# 캐시가 실제로 복원되지 않아 매번 의존성을 새로 컴파일하는 것으로 보인다 — 시간을
# 줄이려면 그쪽을 봐야 한다.
codegen-units = 1
lto = true
opt-level = "s"
strip = true
