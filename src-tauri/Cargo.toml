[package]
name = "sshtool2"
version = "0.45.2"
description = "SSHTool2"
authors = ["Seonghwan Lee"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
russh = "0.62"
russh-sftp = "2.3"
uuid = { version = "1", features = ["v4"] }
aes-gcm = "0.10"
pbkdf2 = "0.12"
sha2 = "0.10"
base64 = "0.22"
encoding_rs = "0.8"
portable-pty = "0.9"
keyring = { version = "3", features = ["windows-native", "linux-native"] }
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
zip = "2"
ureq = "2"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[profile.release]
panic = "abort"
# fat LTO(lto = true) + codegen-units = 1 은 우리 코드가 한 줄만 바뀌어도 의존성까지
# 통째로 다시 링크한다. 의존성 캐시가 살아 있어도 CI 빌드가 8분 가까이 걸리던 이유다.
# thin LTO 는 크레이트 경계 최적화를 대부분 유지하면서 그 재링크 비용을 크게 줄인다.
# 이 앱은 시간의 거의 전부를 네트워크·터미널 I/O 대기로 보내므로 잃는 쪽이 체감되지 않는다.
codegen-units = 16
lto = "thin"
opt-level = "s"
strip = true
