[package]
name = "sshtool2"
version = "0.45.2"
description = "SSHTool2"
authors = ["Seonghwan Lee"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
russh = "0.62"
russh-sftp = "2.3"
uuid = { version = "1", features = ["v4"] }
aes-gcm = "0.10"
pbkdf2 = "0.12"
sha2 = "0.10"
base64 = "0.22"
encoding_rs = "0.8"
portable-pty = "0.9"
keyring = { version = "3", features = ["windows-native", "linux-native"] }
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
zip = "2"
ureq = "2"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[profile.release]
panic = "abort"
# LTO 를 끈다. 의존성 컴파일 결과는 캐시에서 오지만 링크 시점의 전역 최적화는 매번
# 처음부터 하므로, 한 줄만 고쳐도 CI 빌드가 8분 넘게 걸렸다(rdp.rs 한 파일만 바꾼
# 0.45.1 이 522초로 콜드 빌드보다 느렸다). 그 비용이 통째로 사라진다.
#
# 대신 바이너리가 커진다. 사용자 PC 에 설치되는 클라이언트라 용량 영향이 작다는
# 판단(사용자 결정). 실행 성능도 조금 손해지만 이 앱은 시간의 거의 전부를
# 네트워크·터미널 I/O 대기로 보내므로 체감되지 않는다.
#
# 커지는 폭을 줄이려고 opt-level 은 "s"(크기 우선) 그대로 두고 strip 도 유지한다.
codegen-units = 16
lto = false
opt-level = "s"
strip = true
