name: build

# 태그 vX.Y.Z push 시 Windows 러너에서 Tauri 앱 빌드 + 서명 + GitHub Release 생성.
# tauri-action 이 업데이터용 서명 번들과 latest.json 매니페스트를 릴리스에 자동 업로드한다.
#
# workflow_dispatch 로도 돌릴 수 있다(릴리스는 만들지 않는다). 두 가지 용도:
#   · Windows 에서 컴파일이 되는지 배포 전에 확인 — 개발 장비가 리눅스라 로컬에서 못 굽는다.
#   · 빌드 시간·산출물 크기 측정 — 측정하려고 버전을 하나 태우지 않아도 된다.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      note:
        description: '이번 실행 메모(측정 목적 등, 선택)'
        required: false
        default: ''

# 릴리스 생성/에셋 업로드에 필요한 권한.
permissions:
  contents: write

jobs:
  release:
    # WebView2 는 windows-latest 러너에 기본 포함되어 별도 설치 불필요.
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Rust 의존성 캐시(선택) — 빌드 시간 단축.
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # 태그 push 면 릴리스까지, 수동 실행이면 빌드만.
      # tauri-action 은 tagName 이 비어 있으면 릴리스를 만들지 않는다.
      - name: Build, sign and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 업데이터 번들 서명용 개인키 + 암호(키에 암호 없음 → 빈 값).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # src-tauri 가 리포 루트에 위치.
          projectPath: .
          tagName: ${{ github.event_name == 'push' && github.ref_name || '' }}
          releaseName: ${{ github.event_name == 'push' && format('SSHTool2 {0}', github.ref_name) || '' }}
          releaseDraft: false
          prerelease: false
          # Windows NSIS 인스톨러 타겟. 서명된 .nsis.zip + latest.json 이 릴리스에 업로드됨.
          args: --target x86_64-pc-windows-msvc --bundles nsis

      # 산출물 크기를 매 실행마다 남겨 추세를 본다(빌드 옵션을 만질 때 대가를 보려는 것).
      #
      # 경로를 박아 두지 않고 target 아래에서 찾는다 — --target 을 붙이면 산출물이
      # target/<트리플>/release/bundle 로, 빼면 target/release/bundle 로 간다. 한쪽으로
      # 적어 두면 옵션을 바꾼 날 조용히 빈 결과가 나온다(실제로 그랬다).
      #
      # 실패해도 릴리스를 막지 않는다. 이건 보고용이지 빌드의 일부가 아니다.
      - name: 산출물 크기
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          found=$(find src-tauri/target -type f -path '*/bundle/*' \
                    \( -name '*.exe' -o -name '*.zip' \) 2>/dev/null | sort)
          if [ -z "$found" ]; then
            echo "번들 산출물을 찾지 못했습니다."
            echo "target 아래 bundle 디렉터리:"
            find src-tauri/target -type d -name bundle 2>/dev/null | sed 's/^/  /' || true
            exit 0
          fi
          {
            echo "| 파일 | 크기 |"
            echo "|---|---:|"
            while IFS= read -r f; do
              sz=$(stat -c%s "$f")
              printf '| %s | %s MB |\n' "$(basename "$f")" \
                "$(awk -v b="$sz" 'BEGIN{printf "%.2f", b/1048576}')"
            done <<< "$found"
          } | tee -a "$GITHUB_STEP_SUMMARY"
