<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SSHTool2</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <aside id="sidebar">
        <div id="sidebar-head">
          <span class="side-title">세션</span>
          <div class="side-head-actions">
            <button id="quick-connect" title="빠른 접속 (저장 안 함)">⚡</button>
            <button id="new-session" title="새 세션">＋</button>
          </div>
        </div>
        <div id="session-tree"></div>
      </aside>
      <main id="workspace">
        <div id="tabbar"></div>
        <div id="term-area">
          <div id="panes"></div>
          <div id="empty-state">
            <div class="empty-inner">
              <div class="empty-glyph">&gt;_</div>
              <div>좌측에서 세션을 선택해 접속하세요</div>
            </div>
          </div>
        </div>
      </main>
    </div>
    <div id="modal-root"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
